<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>剧本解析进度条交互预览</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f3f4f8; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .panel {
    width: 360px; max-width: 92vw; background: #fff; border-radius: 16px;
    padding: 22px 20px 18px; box-shadow: 0 12px 40px rgba(0,0,0,.12);
  }
  .panel-title { text-align: center; font-size: 15px; font-weight: 600; color: #1a1a2e; }
  .filename { text-align: center; font-size: 12px; color: #999; margin-top: 6px; word-break: break-all; }

  /* ---------- 步骤指示器 ---------- */
  .steps { display: flex; margin-top: 20px; }
  .step { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; }
  .step-line {
    position: absolute; top: 11px; left: 50%; width: 100%; height: 2px;
    background: #e6e8ef; z-index: 0; transition: background .3s ease;
  }
  .step-line.is-done { background: #34c759; }
  .node {
    position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #e6e8ef; color: #fff; font-size: 12px; font-weight: 600;
    transition: background .3s ease, box-shadow .3s ease, transform .2s ease;
  }
  .node.pending { background: #e6e8ef; color: #9aa0ad; }
  .node.active { background: linear-gradient(135deg,#5b7cfa,#8b5cf6); box-shadow: 0 0 0 4px rgba(91,124,250,.18); animation: pulse 1.2s ease-in-out infinite; }
  .node.done { background: #34c759; }
  .node.error { background: #e54d42; }
  .label { margin-top: 6px; font-size: 11px; color: #9aa0ad; text-align: center; transition: color .3s ease; }
  .label.active { color: #5b7cfa; font-weight: 600; }
  .label.done { color: #34c759; }
  .label.error { color: #e54d42; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 3px rgba(91,124,250,.22); }
    50% { box-shadow: 0 0 0 6px rgba(91,124,250,.1); }
  }

  /* ---------- 进度条 ---------- */
  .track { margin-top: 18px; height: 10px; border-radius: 5px; background: #eef0f5; overflow: hidden; }
  .bar {
    height: 100%; border-radius: 5px;
    background: linear-gradient(90deg,#5b7cfa,#8b5cf6);
    transition: width .25s ease;
  }
  .bar.flash { background: linear-gradient(90deg,#34c759,#4cd964); box-shadow: 0 0 10px rgba(52,199,89,.55); }
  .bar.done { background: linear-gradient(90deg,#34c759,#4cd964); }

  .meta { display: flex; justify-content: space-between; margin-top: 8px; }
  .cur { font-size: 14px; font-weight: 600; color: #5b7cfa; }
  .size { font-size: 12px; color: #999; }
  .hint { display: block; margin-top: 6px; font-size: 11px; color: #aaa; }
  .sub { font-size: 11px; color: #aaa; }

  .btn {
    display: block; width: 100%; margin-top: 18px; padding: 11px;
    border: none; border-radius: 10px; background: #5b7cfa; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { background: #b9c4f7; }
  .btn.ghost { background: #fff; color: #5b7cfa; border: 1px solid #d6ddf7; }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-title" id="title">📄 导入 DM 指南</div>
    <div class="filename" id="filename">《迷雾山庄》主持人指南.pdf · 328MB</div>

    <div class="steps" id="steps"></div>

    <div class="track"><div class="bar" id="bar" style="width:0%"></div></div>
    <div class="meta">
      <span class="cur" id="cur">校验文件 · 8%</span>
      <span class="size" id="size"></span>
    </div>
    <span class="hint" id="hint"></span>
    <div class="meta" id="submeta" style="display:none">
      <span class="sub" id="sub1"></span>
      <span class="sub" id="sub2"></span>
    </div>

    <button class="btn" id="startBtn">开始模拟导入</button>
    <button class="btn ghost" id="resetBtn" style="display:none">重新模拟</button>
  </div>

<script>
const STEPS = [
  { stage:'hashing',   label:'校验文件', hint:'计算文件指纹' },
  { stage:'preparing', label:'准备上传', hint:'申请上传任务' },
  { stage:'uploading',  label:'上传分片', hint:'直传阿里云 OSS' },
  { stage:'merging',   label:'合并文件', hint:'服务端合并分片' },
  { stage:'finishing', label:'生成链接', hint:'换取访问地址' },
];
const START = 8, CAP = 99, FLASH_MS = 280;

let current = 0, pct = 0, flash = false, animTimer = null, flashTimer = null, uploadTimer = null;
const $ = (id) => document.getElementById(id);

function renderSteps(status) {
  const wrap = $('steps'); wrap.innerHTML = '';
  STEPS.forEach((s, i) => {
    let st = i < current ? 'done' : i === current ? (status || 'active') : 'pending';
    if ($('bar').dataset.done === '1') st = 'done';
    const lineDone = i < current || $('bar').dataset.done === '1';
    const step = document.createElement('div'); step.className = 'step';
    if (i < STEPS.length - 1) {
      const line = document.createElement('div'); line.className = 'step-line' + (lineDone ? ' is-done' : ''); step.appendChild(line);
    }
    const node = document.createElement('div'); node.className = 'node ' + st;
    node.textContent = st === 'done' ? '✓' : st === 'error' ? '!' : (i + 1);
    const label = document.createElement('div'); label.className = 'label ' + st; label.textContent = s.label;
    step.appendChild(node); step.appendChild(label); wrap.appendChild(step);
  });
}

function setBar(width, extra) {
  const bar = $('bar');
  bar.style.width = width + '%';
  bar.className = 'bar' + (extra ? ' ' + extra : '');
}

function start() {
  current = 0; pct = START; flash = false;
  $('bar').dataset.done = '';
  $('startBtn').disabled = true; $('resetBtn').style.display = 'none';
  $('size').textContent = ''; $('submeta').style.display = 'none';
  runStage(0);
}

function runStage(idx) {
  current = idx;
  renderSteps();
  const meta = STEPS[idx];
  $('title').textContent = meta.label;
  $('size').textContent = '';
  $('hint').textContent = (idx === 2 ? '上传中' : '进行中') + '：' + meta.hint + '…';
  $('cur').textContent = meta.label + ' · ' + Math.round(pct) + '%';

  if (idx === 2) {
    // 上传：真实进度模拟 0->100 然后进入合并
    $('submeta').style.display = 'flex';
    uploadTimer = setInterval(() => {
      if (flash) return; // 闪光期间冻结
      pct = Math.min(100, pct + Math.random() * 9 + 3);
      setBar(pct);
      $('cur').textContent = '上传分片 · ' + Math.round(pct) + '%';
      $('size').textContent = Math.round(pct / 100 * 328) + ' / 328 MB';
      $('sub1').textContent = '分片 ' + Math.round(pct / 100 * 120) + '/120 · 6.2 MB/s';
      $('sub2').textContent = '剩余 ' + Math.max(0, Math.round((100 - pct) / 6)) + 's';
      if (pct >= 100) { clearInterval(uploadTimer); nextStage(); }
    }, 260);
    return;
  }

  // 非上传步骤：缓动逼近 99%
  animTimer = setInterval(() => {
    if (flash) return;
    pct = pct >= CAP ? pct : Math.min(CAP, pct + Math.max(1.5, (CAP - pct) * 0.18));
    setBar(pct);
    $('cur').textContent = meta.label + ' · ' + Math.round(pct) + '%';
  }, 220);
  // 步骤随机耗时后进入下一步（演示用，1~2.2s）
  const dur = 1000 + Math.random() * 1200;
  flashTimer = setTimeout(nextStage, dur);
}

function nextStage() {
  if (flashTimer) clearTimeout(flashTimer);
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
  if (uploadTimer) { clearInterval(uploadTimer); uploadTimer = null; }

  const next = current + 1;
  // 上一步完成闪光
  flash = true;
  setBar(100, 'flash');
  $('cur').textContent = STEPS[current].label + ' · 100%';

  flashTimer = setTimeout(() => {
    flash = false;
    if (next >= STEPS.length) {
      // 全部完成
      $('bar').dataset.done = '1';
      setBar(100, 'done');
      $('title').textContent = '🎉 导入成功';
      $('cur').textContent = '全部步骤完成';
      $('hint').textContent = '';
      $('size').textContent = '';
      $('submeta').style.display = 'none';
      renderSteps();
      $('startBtn').disabled = false; $('resetBtn').style.display = 'block';
      return;
    }
    pct = START;
    setBar(START);
    renderSteps();
    runStage(next);
  }, FLASH_MS);
}

$('startBtn').addEventListener('click', start);
$('resetBtn').addEventListener('click', start);
renderSteps();
</script>
</body>
</html>
